<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المستند الإلكتروني</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #172b4d;
    }
    header {
      background: #ffffff;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
    }
    main {
      max-width: 1200px;
      margin: 16px auto;
      padding: 0 10px;
    }
    iframe {
      display: block;
      width: 100%;
      height: 85vh;
      min-height: 500px;
      border: 0;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>المستند الإلكتروني</h1>
  </header>
  <main>
    <iframe src="document.pdf" title="ملف PDF"></iframe>
  </main>
</body>
</html>
